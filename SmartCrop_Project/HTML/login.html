<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SmartCrop</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            🌱 SmartCrop
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="crop-advisory.html">Crop Advisory</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="weather.html">Weather</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p>Login to your SmartCrop account</p>


            <!-- PHP Login Form -->
            <form action="../php/login.php" method="POST">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="btn login-submit">
                    Login
                </button>

            </form>


            <p class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © <span class="current-year"></span>
            SmartCrop. All Rights Reserved.
        </p>

        <p>
            Smart Crop Advisory & Marketplace Platform
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
